[package]
name = "pb-rs"
version = "0.10.0"
description = "A converter from proto files into quick-protobuf compatible Rust module"
authors = ["Johann Tuffe <tafia973@gmail.com>"]
keywords = ["protobuf", "parser", "quick-protobuf"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/tafia/quick-protobuf"
edition = "2018"
rust-version = "1.65"

[dependencies]
nom = "8.0.0"
log = "0.4.29"
clap = { version = "4.5.60", optional = true }
env_logger = { version = "0.11.9", optional = true }

[dev-dependencies]
walkdir = "2.5.0"

[features]
default = ["std"]
std = ["clap", "env_logger"]
generateImplFromForEnums = []
